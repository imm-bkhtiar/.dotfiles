allow_remote_control yes
enable_audio_bell no
enabled_layouts tall 

# Font
font_family      GeistMono Nerd Font
bold_font        GeistMono Nerd Font Bold
font_size        10

# Window size
initial_window_width  100c
initial_window_height 30c

# Cursor
cursor_shape           block
cursor_blink_interval 1
cursor_stop_blinking_after 0
cursor_text_color  background
cursor_color       #ffffff

# Padding (mirip internalBorder)
window_padding_width 5

# Colors
background #282A2E 
foreground #e7eaf8 

color0  #282A2E 
color8  #7f7f7f
color1  #A00000
color9  #FF0000
color2  #00A000
color10 #00FF00
color3  #A0A000
color11 #FFFF00
color4  #0000A0
color12 #5C5CFF
color5  #A000A0
color13 #FF00FF
color6  #00A0A0
color14 #00FFFF
color7  #C0C0C0
color15 #ffffff

# Scrollback behaviour
scrollback_lines 10000

# Mouse
mouse_hide_wait 3
copy_on_select yes

# Window title
allow_remote_control no

# Disable opacity (equivalent)
background_opacity 1.0

# Performance tweaks
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Cursor theme
x11_cursor_theme ArcAurora-cursors
x11_cursor_size 24
